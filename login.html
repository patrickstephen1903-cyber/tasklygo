<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly.go - Iniciar Sesión</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; color: #34495e; }
    input, select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #219150; }
    .toggle { text-align: center; margin-top: 15px; font-size: 13px; color: #2980b9; cursor: pointer; }
    .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="titulo">✨ Taskly.go</h2>

    <form id="authForm">
      <div id="campoNombre" style="display: none;">
        <label>Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
      </div>

      <label>Correo Electrónico:</label>
      <input type="email" id="email" required placeholder="correo@ejemplo.com">

      <label>Contraseña:</label>
      <input type="password" id="password" required placeholder="••••••••">

      <div id="campoRol" style="display: none;">
        <label>Tipo de Usuario:</label>
        <select id="rol">
          <option value="Cliente">Cliente (Solicitar servicios)</option>
          <option value="Trabajador">Trabajador (Ofrecer servicios)</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">Ingresar</button>
    </form>

    <div id="mensajeError" class="error-msg"></div>
    <div class="toggle" onclick="toggleModo()" id="btnToggle">¿No tienes cuenta? Regístrate aquí</div>
  </div>

  <script>
    let esRegistro = false;
    const API_URL = 'https://tasklygo-backend.onrender.com';

    function toggleModo() {
      esRegistro = !esRegistro;
      document.getElementById('titulo').innerText = esRegistro ? 'Registro en Taskly.go' : '✨ Taskly.go';
      document.getElementById('campoNombre').style.display = esRegistro ? 'block' : 'none';
      document.getElementById('campoRol').style.display = esRegistro ? 'block' : 'none';
      document.getElementById('btnSubmit').innerText = esRegistro ? 'Registrarse' : 'Ingresar';
      document.getElementById('btnToggle').innerText = esRegistro ? '¿Ya tienes cuenta? Inicia Sesión' : '¿No tienes cuenta? Regístrate aquí';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('mensajeError');
      errorDiv.style.display = 'none';

      const endpoint = esRegistro ? '/registro' : '/login';
      const bodyData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      if (esRegistro) {
        bodyData.nombre = document.getElementById('nombre').value;
        bodyData.rol = document.getElementById('rol').value;
      }

      try {
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();

        if (res.ok) {
          // Guardar credenciales en LocalStorage
          localStorage.setItem('token', data.token || 'token-demo');
          localStorage.setItem('usuario', JSON.stringify(data.usuario || { nombre: bodyData.nombre || 'Usuario', rol: bodyData.rol || 'Cliente' }));

          const usuarioGuardado = JSON.parse(localStorage.getItem('usuario'));

          // 🔀 Redirección Automática según el Rol
          if (usuarioGuardado.rol === 'Trabajador') {
            window.location.href = 'trabajador.html';
          } else {
            window.location.href = 'cliente.html';
          }
        } else {
          errorDiv.innerText = data.mensaje || 'Ocurrió un error. Intenta de nuevo.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        errorDiv.innerText = 'Error de conexión con el servidor.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
