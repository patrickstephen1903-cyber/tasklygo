<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasklygo - Iniciar Sesión</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
    .card { background: white; width: 100%; max-width: 420px; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); box-sizing: border-box; text-align: center; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    input { width: 100%; padding: 14px; margin-top: 12px; box-sizing: border-box; border: 1px solid #ccd1d1; border-radius: 8px; font-size: 15px; background-color: #fff; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #27ae60; box-shadow: 0 0 5px rgba(39, 174, 96, 0.2); }
    input.error-input { border-color: #e74c3c; background-color: #fff8f8; }
    
    button.btn-login { background-color: #27ae60; color: white; border: none; padding: 14px; margin-top: 20px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); transition: background 0.2s; }
    button.btn-login:hover { background-color: #219150; }

    .links-container { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .links-container a { color: #3498db; text-decoration: none; font-weight: 500; }
    .links-container a:hover { text-decoration: underline; }

    .error-message { display: none; text-align: left; color: #e74c3c; font-size: 13px; margin-top: 6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h1> Tasklygo</h1>

    <form id="formLogin">
      <input type="text" id="email" required placeholder="Correo electrónico o número de celular">
      <input type="password" id="password" required placeholder="Contraseña">
      
      <div id="mensajeError" class="error-message" style="display: none;">
        <span>⚠️</span> La contraseña que ingresaste es incorrecta.
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <div class="links-container">
      <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a>
    </div>
  </div>

  <script>
    const API_URL = 'https://tasklygo-backend.onrender.com';

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('mensajeError');
      
      errorBox.style.display = 'none';
      passwordInput.classList.remove('error-input');

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.usuario));

          if (data.usuario.rol === 'trabajador') {
            window.location.href = 'trabajador.html';
          } else {
            window.location.href = 'index.html';
          }
        } else {
          passwordInput.classList.add('error-input');
          errorBox.style.display = 'flex';
        }
      } catch (err) {
        console.error('Error de conexión:', err);
        passwordInput.classList.add('error-input');
        errorBox.innerHTML = '<span>⚠️</span> No se pudo conectar con el servidor.';
        errorBox.style.display = 'flex';
      }
    });
  </script>

</body>
</html>
