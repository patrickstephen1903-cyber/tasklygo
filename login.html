<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasklygo - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #64748b; }
        .tab.active { color: #2563eb; border-bottom: 3px solid #2563eb; margin-bottom: -2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #475569; font-size: 14px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .mensaje { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 600; }
        .exito { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>

<div class="card">
    <h2>Tasklygo</h2>
    
    <div class="tabs">
        <div id="tab-login" class="tab active">Ingresar</div>
        <div id="tab-registro" class="tab">Registrarse</div>
    </div>

    <!-- FORMULARIO LOGIN -->
    <form id="form-login">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="login-email" required placeholder="correo@ejemplo.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login">Entrar</button>
    </form>

    <!-- FORMULARIO REGISTRO -->
    <form id="form-registro" style="display: none;">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="reg-nombre" required placeholder="Juan Pérez">
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="reg-email" required placeholder="correo@ejemplo.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" required placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Tipo de Usuario</label>
            <select id="reg-rol">
                <option value="cliente">Cliente (Solicitar Servicios)</option>
                <option value="trabajador">Trabajador / Técnico</option>
            </select>
        </div>
        <button type="submit" id="btn-registro">Crear Cuenta</button>
    </form>

    <div id="mensaje" class="mensaje"></div>
</div>

<script>
    const API_URL = 'https://tasklygoweb1-1.onrender.com';

    // Elementos del DOM
    const tabLogin = document.getElementById('tab-login');
    const tabRegistro = document.getElementById('tab-registro');
    const formLogin = document.getElementById('form-login');
    const formRegistro = document.getElementById('form-registro');
    const msg = document.getElementById('mensaje');

    // Cambiar de Pestaña
    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegistro.classList.remove('active');
        formLogin.style.display = 'block';
        formRegistro.style.display = 'none';
        msg.innerText = '';
    });

    tabRegistro.addEventListener('click', () => {
        tabRegistro.classList.add('active');
        tabLogin.classList.remove('active');
        formLogin.style.display = 'none';
        formRegistro.style.display = 'block';
        msg.innerText = '';
    });

    // EVENTO LOGIN
    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        console.log('📡 Enviando petición de Login...');
        
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login');

        btn.disabled = true;
        btn.innerText = 'Cargando...';
        msg.innerText = '';

        try {
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            console.log('📩 Respuesta del servidor:', data);

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                msg.className = 'mensaje exito';
                msg.innerText = '¡Bienvenido! Redirigiendo...';

                setTimeout(() => {
                    window.location.href = data.usuario.rol === 'trabajador' ? 'trabajador.html' : 'cliente.html';
                }, 1000);
            } else {
                msg.className = 'mensaje error';
                msg.innerText = data.error || 'Error al iniciar sesión';
            }
        } catch (err) {
            console.error('❌ Error de conexión:', err);
            msg.className = 'mensaje error';
            msg.innerText = 'Error de conexión con el servidor';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Entrar';
        }
    });

    // EVENTO REGISTRO
    formRegistro.addEventListener('submit', async (e) => {
        e.preventDefault();
        console.log('📡 Enviando petición de Registro...');

        const nombre = document.getElementById('reg-nombre').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const rol = document.getElementById('reg-rol').value;
        const btn = document.getElementById('btn-registro');

        btn.disabled = true;
        btn.innerText = 'Cargando...';
        msg.innerText = '';

        try {
            const res = await fetch(`${API_URL}/registro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, password, rol })
            });
            const data = await res.json();
            console.log('📩 Respuesta del servidor:', data);

            if (res.ok) {
                msg.className = 'mensaje exito';
                msg.innerText = '¡Cuenta creada con éxito! Ahora puedes ingresar.';
                setTimeout(() => tabLogin.click(), 1500);
            } else {
                msg.className = 'mensaje error';
                msg.innerText = data.error || 'Error al registrar';
            }
        } catch (err) {
            console.error('❌ Error de conexión:', err);
            msg.className = 'mensaje error';
            msg.innerText = 'Error de conexión con el servidor';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Crear Cuenta';
        }
    });
</script>

</body>
</html>
